name: Post Updates to Discord

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify-merge:
    # 1. PR must be merged (not closed without merging)
    # 2. PR author is NOT a bot (excludes your app token bot, dependabot, etc.)
    if: >-
      github.event.pull_request.merged == true &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      github.event.pull_request.user.login != 'rss-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Embed Notification
        env:
          DISCORD_WEBHOOK_UPDATES: ${{ secrets.DISCORD_WEBHOOK_UPDATES }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGED_BY: ${{ github.actor }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_UPDATES:-}" ]; then
            echo "Error: DISCORD_WEBHOOK_UPDATES secret is missing." >&2
            exit 1
          fi

          # Let jq safely handle title/body string concatenation and character escaping natively
          PAYLOAD=$(jq -n \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg body "${PR_BODY:-}" \
            --arg url "$PR_URL" \
            --arg author_name "$PR_AUTHOR" \
            --arg author_icon "$PR_AUTHOR_AVATAR" \
            --arg repo "$REPO_NAME" \
            --arg merged_by "$MERGED_BY" \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              embeds: [{
                title: ("🔀 Pull Request Merged: #" + $number),
                url: $url,
                description: ("**" + $title + "**\n\n" + $body),
                color: 8359053,
                author: {
                  name: $author_name,
                  icon_url: $author_icon
                },
                fields: [
                  { name: "Repository", value: ("[" + $repo + "](https://github.com/" + $repo + ")"), inline: true },
                  { name: "Merged By", value: $merged_by, inline: true }
                ],
                footer: { text: "GitHub Actions • RSS Bot Pipeline" },
                timestamp: $timestamp
              }]
            }')

          curl -sS -X POST \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$DISCORD_WEBHOOK_UPDATES"
