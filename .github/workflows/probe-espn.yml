name: Probe ESPN reachability

# Manual only. Answers one question: which NFL feed candidates does a GitHub-hosted runner's
# egress actually get a usable response from? Read the summary at the bottom of the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Probe candidates
        run: node scripts/probe-espn.mjs
